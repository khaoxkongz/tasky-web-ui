name: tasky-web-ui

services:
  postgres:
    image: postgres
    container_name: tasky-web-ui-postgres
    environment:
      POSTGRES_DB: tasky-web-ui
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - tasky-web-ui_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  tasky-web-ui_postgres_data:
